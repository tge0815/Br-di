<!DOCTYPE html>

  <script>
    // Audio-Brücke: nutzt die prozedurale SFX-Engine der 2D-Version
    window.BR3D = window.BR3D || {};
    window.BR3D.sfx = function (n) { if (window.BR && BR.audio) BR.audio.sfx(n); };
    window.BR3D.audioUnlock = function () { if (window.BR && BR.audio) BR.audio.unlock(); };
