server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Dateien/Verzeichnisse ausliefern; fehlende Pfade -> klarer 404
    # (kein SPA-Fallback, damit ein fehlendes Asset nicht als weiße Seite endet)
    location / {
        try_files $uri $uri/ =404;
    }

    # JS/CSS mit korrekten MIME-Typen und kurzem Cache (Spiel entwickelt sich weiter)
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # index.html nie aggressiv cachen, damit Updates sofort ankommen
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;
    gzip_min_length 512;
}
