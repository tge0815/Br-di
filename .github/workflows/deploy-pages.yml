name: Deploy zu GitHub Pages

# Deployt das statische Spiel bei jedem Push auf main (oder manuell).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte, die das Deployment auf Pages braucht.
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deployment gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages einrichten (aktiviert Pages automatisch)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Statische Dateien als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
